openapi: 3.0.0
info:
  description: 'This swagger documents the Runeo api.'
  version: 'v3.1.1'
  title: 'Runeo'
tags:
  - name: 'me'
    description: 'Routes related to the authenticated user'
  - name: 'users'
    description: 'Users resource'
  - name: 'schedule'
    description: 'Schedule resource'
  - name: 'runs'
    description: 'Runs resource'
  - name: 'runs.logs'
    description: "Run's log resource"
  - name: 'runners'
    description: 'Runners resource (subscriptions)'
  - name: 'cars'
    description: 'Cars resource'
  - name: 'cars.comments'
    description: 'Cars comments'
  - name: 'groups'
    description: 'Groups resource'
  - name: 'fastDials'
    description: 'fastDials resource'
  - name: 'tracks'
    description: 'Tracks resource (optimisation)'
paths:
  /me/token:
    post:
      tags:
        - 'me'
      summary: 'Authenticate user with email and password'
      description: 'Login endpoint that returns a Bearer token and user information'
      requestBody:
        description: User credentials
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: 'user@example.com'
                password:
                  type: string
                  example: 'password123'
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: 'Bearer token for authentication'
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
  /me:
    get:
      tags:
        - 'me'
      summary: 'Get the current authenticated user'
      description: 'Check the bearer authentication, and return the current User model'
      security:
        - bearerAuth: []
      responses:
        '200': # status code
          description: User model serialized to JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /me/runs:
    get:
      tags:
        - 'me'
      summary: 'Get the current authenticated user runs'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 'OK'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Run'
  /me/push-token:
    post:
      tags:
        - 'me'
      summary: 'Register or update the push notification token'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  example: 'ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]'
      responses:
        '200':
          description: 'Token saved'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  /me/notifications:
    get:
      tags:
        - 'me'
      summary: 'Get the last 50 push notifications sent to the authenticated user'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 'OK'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
  /users:
    get:
      tags:
        - 'users'
      summary: 'Get all the users'
      security:
        - bearerAuth: []
      responses:
        '200': # status code
          description: 'User model serialized to JSON'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
  /users/{user}/schedule:
    get:
      tags:
        - 'users'
      summary: "Get user's schedule by his ID"
      security:
        - bearerAuth: []
      parameters:
        - name: user
          in: path
          required: true
          description: 'The id of the user'
          example: 1
          schema:
            type: integer
            minimum: 1
      responses:
        '200': # status code
          description: "User's schedule serialized to JSON"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'

  /allruns:
    get:
      tags:
        - 'runs'
      summary: 'Get all runs without status filter (admin only)'
      security:
        - bearerAuth: []
      parameters:
        - name: onlyFromTime
          in: query
          required: false
          description: 'Filter runs from a specific date/time (ISO DateTime string)'
          example: '2019-03-13T11:42:53'
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 'OK'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Run'
        '403':
          description: 'Forbidden — requires runreadall permission'
  /notifications/send:
    post:
      tags:
        - 'me'
      summary: 'Send a notification (SMS or push) to a specific user'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - message
              properties:
                userId:
                  type: integer
                  example: 42
                message:
                  type: string
                  maxLength: 640
                  example: 'Votre run démarre dans 10 minutes.'
      responses:
        '200':
          description: 'Notification sent'
          content:
            application/json:
              schema:
                type: object
                properties:
                  channel:
                    type: string
                    example: 'push'
                  status:
                    type: string
                    example: 'sent'
        '400':
          description: 'Bad request (no active channel, missing token, send failure)'
        '403':
          description: 'Forbidden — requires sendnotifications permission'
  /runs:
    get:
      tags:
        - 'runs'
      summary: 'Get all the runs'
      security:
        - bearerAuth: []
      parameters:
        - name: onlyFromTime
          in: query
          required: false
          description: 'Filter runs from a specific date/time (ISO DateTime string)'
          example: '2019-03-13T11:42:53'
          schema:
            type: string
            format: date-time
      responses:
        '200': # status code
          description: 'Run model serialized to JSON'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Run'
  /tracks:
    get:
      tags:
        - 'tracks'
      summary: 'Get all the runs, in track format for optimisation research'
      security:
        - bearerAuth: []
      responses:
        '200': # status code
          description: 'Run track serialized to JSON'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Track'
  /runs/{run}/start:
    patch:
      tags:
        - 'runs'
      summary: 'Start a specific run by his ID'
      security:
        - bearerAuth: []
      parameters:
        - name: run
          in: path
          required: true
          description: 'The id of the run'
          example: 1
          schema:
            type: integer
            minimum: 1
      responses:
        '200': # status code
          description: 'Run model serialized to JSON'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
  /runs/{run}/stop:
    patch:
      tags:
        - 'runs'
      summary: 'Stop a specific run by his ID'
      security:
        - bearerAuth: []
      parameters:
        - name: run
          in: path
          required: true
          description: 'The id of the run'
          example: 1
          schema:
            type: integer
            minimum: 1
      responses:
        '200': # status code
          description: 'Run model serialized to JSON'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
  /runs/{run}/acknowledge:
    patch:
      tags:
        - 'runs'
      summary: 'Acknowledge the data of a specific run by his ID'
      security:
        - bearerAuth: []
      parameters:
        - name: run
          in: path
          required: true
          description: 'The id of the run'
          example: 1
          schema:
            type: integer
            minimum: 1
      responses:
        '200': # status code
          description: 'Run model serialized to JSON'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
  /runs/artist/{artist}:
    get:
      tags:
        - 'runs'
      summary: 'Get all the runs for a specified artist'
      security:
        - bearerAuth: []
      parameters:
        - name: artist
          in: path
          required: true
          description: 'The id of the artist'
          example: 1
          schema:
            type: integer
            minimum: 1
      responses:
        '200': # status code
          description: 'Run model serialized to JSON'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Run'
  /runs/{run}/logs:
    get:
      tags:
        - 'runs.logs'
      summary: 'Get all log entries for the run'
      security:
        - bearerAuth: []
      parameters:
        - name: run
          in: path
          required: true
          description: 'The id of the run'
          schema:
            type: integer
      responses:
        '200':
          description: 'Ok'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LogEntry'

    post:
      tags:
        - 'runs.logs'
      summary: 'Post a log entry for the run'
      security:
        - bearerAuth: []
      parameters:
        - name: run
          in: path
          required: true
          description: 'The id of the run'
          schema:
            type: integer
      requestBody:
        description: Log entry content
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  example: "Il y a plein de bouchons sur l'autoroute"
      responses:
        '200':
          description: 'Ok'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogEntry'
  /units/{unit}/driver:
    patch:
      tags:
        - 'runners'
      summary: 'Add the current authenticated user to the selected unit'
      security:
        - bearerAuth: []
      parameters:
        - name: unit
          in: path
          required: true
          description: 'The id of the unit'
          example: 1
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: 'Run model serialized to JSON'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '409':
          description: 'Ce poste est déjà pris par un autre conducteur'
  /units/{unit}/car:
    patch:
      tags:
        - 'runners'
      summary: 'Add the parameter car to the selected unit'
      security:
        - bearerAuth: []
      parameters:
        - name: unit
          in: path
          required: true
          description: 'The id of the unit'
          example: 1
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                car_id:
                  type: integer
                  example: 1
      responses:
        '200':
          description: 'Run model serialized to JSON'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
  /runners/{runner}/driver:
    patch:
      tags:
        - 'runners'
      summary: 'Add the current authenticated user to the selected subscription'
      security:
        - bearerAuth: []
      parameters:
        - name: runner
          in: path
          required: true
          description: 'The id of the run subscription'
          example: 1
          schema:
            type: integer
            minimum: 1
      responses:
        '200': # status code
          description: 'Run model serialized to JSON'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '409':
          description: 'Ce poste est déjà pris par un autre conducteur'
  /runners/{runner}/car:
    patch:
      tags:
        - 'runners'
      summary: 'Add the parameter car to the selected subscription'
      security:
        - bearerAuth: []
      parameters:
        - name: runner
          in: path
          required: true
          description: 'The id of the run subscription'
          example: 1
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                car_id:
                  type: integer
                  example: 1
      responses:
        '200': # status code
          description: 'Run model serialized to JSON'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
  /cars:
    get:
      tags:
        - 'cars'
      summary: 'Get all the cars'
      security:
        - bearerAuth: []
      responses:
        '200': # status code
          description: 'Car model serialized to JSON'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Car'
  /cars/{car}/comments:
    post:
      tags:
        - 'cars.comments'
      summary: 'Create new comment for the specified car'
      security:
        - bearerAuth: []
      parameters:
        - name: car
          in: path
          required: true
          description: 'The id of the car'
          example: 1
          schema:
            type: integer
            minimum: 1
      requestBody:
        description: The datas of our new comment
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequest'
      responses:
        '201': # status code
          description: 'Car model serialized to JSON'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
  /schedule:
    get:
      tags:
        - 'schedule'
      summary: 'Get all the schedules'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 'Schedule model serialized to JSON'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Schedule'
    post:
      tags:
        - 'schedule'
      summary: 'Create a new schedule'
      security:
        - bearerAuth: []
      requestBody:
        description: The data to create the schedule
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Schedule'
      responses:
        '201':
          description: 'Schedule model serialized to JSON'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
  /schedule/create:
    get:
      tags:
        - 'schedule'
      summary: 'Get the data needed to create a schedule'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 'Schedule model serialized to JSON'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
  /schedule/{id}:
    get:
      tags:
        - 'schedule'
      summary: 'Get a schedule by its ID'
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 'The id of the schedule'
          example: 1
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: 'Schedule model serialized to JSON'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
    post:
      tags:
        - 'schedule'
      summary: 'Update a schedule by its ID'
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 'The id of the schedule'
          example: 1
          schema:
            type: integer
            minimum: 1
      requestBody:
        description: The data to update the schedule
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Schedule'
      responses:
        '200':
          description: 'Schedule model serialized to JSON'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
    delete:
      tags:
        - 'schedule'
      summary: 'Delete a schedule by its ID'
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 'The id of the schedule'
          example: 1
          schema:
            type: integer
            minimum: 1
      responses:
        '204':
          description: 'No content'
  /schedule/{id}/edit:
    get:
      tags:
        - 'schedule'
      summary: 'Get the data to edit a schedule by its ID'
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 'The id of the schedule'
          example: 1
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: 'Schedule model serialized to JSON'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
  /groups:
    get:
      tags:
        - 'groups'
      summary: 'Get all the groups'
      responses:
        '200': # status code
          description: 'Group model serialized to JSON'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
  /groups/{group}:
    get:
      tags:
        - 'groups'
      summary: 'Get specific group by his ID'
      parameters:
        - name: group
          in: path
          required: true
          description: 'The id of the group'
          example: 1
          schema:
            type: integer
            minimum: 1
      responses:
        '200': # status code
          description: 'Group model serialized to JSON'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'

  /fastDial:
    get:
      tags:
        - 'fastDials'
      summary: 'Get all fast dials'
      security:
        - bearerAuth: []
      responses:
        '200': # status code
          description: 'Group model serialized to JSON'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FastDial'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: base64
  schemas:
    PaginatedResponse:
      type: object
      properties:
        links:
          type: object
          properties:
            first:
              type: string
            last:
              type: string
            prev:
              type: string
            next:
              type: string

        meta:
          type: object
          properties:
            current_page:
              type: number
            from:
              type: number
            last_page:
              type: number
            path:
              type: string
            per_page:
              type: number
            to:
              type: number
            total:
              type: number
    User:
      type: 'object'
      properties:
        id:
          type: 'integer'
        name:
          type: 'string'
        firstname:
          type: 'string'
        lastname:
          type: 'string'
        email:
          type: 'string'
        phone_number:
          type: 'string'
        status:
          type: 'string'
        role:
          type: 'string'
        image_profile:
          type: 'string'
          description: 'base64-encoded picture for the profile'
        image_license:
          type: 'string'
          description: "base64-encoded picture of the driver's license"
        picture:
          type: 'string'
          description: 'Filename of the profile picture stored on the server'
        has_notification_token:
          type: 'boolean'
    Run:
      type: 'object'
      properties:
        id:
          type: 'integer'
        status:
          type: 'string'
        title:
          type: 'string'
        begin_at:
          type: 'string'
        start_at:
          type: 'string'
        updated_at:
          type: 'string'
        acknowledged_at:
          type: 'string'
        pax_tbc:
          type: 'integer'
        end_at:
          type: 'string'
        finished_at:
          type: 'string'
        nb_passenger:
          type: 'string'
        runinfo:
          type: 'string'
        name_contact:
          type: 'string'
        num_contact:
          type: 'string'
        is_mine:
          type: 'boolean'
          description: "true si l'utilisateur authentifié est référencé par une unité de ce run"
        schedule_overlap:
          type: 'integer'
          description: >
            Relation entre le run et l'horaire du chauffeur :
            -2 = aucun chevauchement (run entièrement avant ou après l'horaire),
            -1 = le run commence avant l'horaire (mais se termine dans l'horaire),
            0 = le run est entièrement dans l'horaire,
            1 = le run se termine après l'horaire (mais commence dans l'horaire),
            2 = le run déborde avant et après l'horaire.
            null si le chauffeur n'est pas assigné ou n'a pas d'horaire.
        driver_can_apply:
          type: 'boolean'
        driver_can_pick_vehicle:
          type: 'boolean'
        waypoints:
          type: 'array'
          items:
            $ref: '#/components/schemas/Waypoint'
        runners:
          type: 'array'
          items:
            $ref: '#/components/schemas/Runner'
        artist_id:
          type: 'integer'
        google:
          type: 'string'
          nullable: true
          description: 'Google Maps URL linking all waypoints in order, or null if coordinates are missing'
    Track:
      type: 'object'
      properties:
        id:
          type: 'integer'
        status:
          type: 'string'
        trackpoints:
          type: 'array'
          items:
            $ref: '#/components/schemas/Trackpoint'
    Waypoint:
      type: 'object'
      properties:
        nickname:
          type: 'string'
        is_meeting:
          type: 'boolean'
        passing_time:
          type: 'string'
    Trackpoint:
      type: 'object'
      properties:
        passing_time:
          type: 'string'
        latitude:
          type: 'number'
        longitude:
          type: 'number'
    Runner:
      type: 'object'
      properties:
        id:
          type: 'integer'
        user:
          type: 'object'
          nullable: true
          properties:
            id:
              type: 'integer'
            name:
              type: 'string'
            firstname:
              type: 'string'
            lastname:
              type: 'string'
            email:
              type: 'string'
            phone_number:
              type: 'string'
        vehicle_category:
          $ref: '#/components/schemas/CarType'
        vehicle:
          type: 'object'
          nullable: true
          properties:
            id:
              type: 'integer'
            name:
              type: 'string'
            plate_number:
              type: 'string'
    CarType:
      type: 'object'
      properties:
        type:
          type: 'string'
        description:
          type: 'string'
    Car:
      type: 'object'
      properties:
        id:
          type: 'integer'
        name:
          type: 'string'
        plate_number:
          type: 'string'
        nb_place:
          type: 'integer'
        status_slug:
          type: string
        status_name:
          type: string
        user:
          type: 'boolean'
        type:
          $ref: '#/components/schemas/CarType'
        comments:
          type: 'array'
          items:
            $ref: '#/components/schemas/Comment'
    Comment:
      type: 'object'
      properties:
        id:
          type: 'integer'
        content:
          type: 'string'
        user:
          type: 'object'
          nullable: true
          properties:
            id:
              type: 'integer'
            name:
              type: 'string'
        created_at:
          type: 'string'
    Group:
      type: 'object'
      properties:
        color:
          type: 'string'
        name:
          type: 'string'
    CarRequest:
      type: 'object'
      properties:
        name:
          type: 'string'
          example: 'OneCar'
        plate_number:
          type: 'string'
          example: 'VD 219310'
        brand:
          type: 'string'
          example: 'Mercedes'
        model:
          type: 'string'
          example: 'Vito'
        color:
          type: 'string'
          example: 'red'
        status_id:
          type: 'integer'
          example: 2
        type_id:
          type: 'integer'
          example: 1
    CommentRequest:
      type: 'object'
      properties:
        content:
          type: 'string'
          example: 'The guy that created this doc is awesome!'
    UserRequest:
      type: 'object'
      required:
        - name
        - firstname
        - lastname
        - email
      properties:
        name:
          type: 'string'
          example: 'jdupont'
        firstname:
          type: 'string'
          example: 'Jean'
        lastname:
          type: 'string'
